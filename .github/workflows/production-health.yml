name: RouteRiff production health
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health.yml"
      - "index.html"
      - "vercel.json"
      - "api/**"
      - ".well-known/**"
      - "ai/**"
      - "sitemap.xml"
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deployment
        shell: bash
        run: sleep 20

      - name: Check health endpoint
        shell: bash
        run: |
          BODY="$(curl -fsS --max-time 15 https://routeriff.vercel.app/api/health)"
          echo "$BODY"
          printf "%s" "$BODY" | grep -q '"ok":true'
          printf "%s" "$BODY" | grep -q '"service":"routeriff"'
      - name: Check homepage
        shell: bash
        run: |
          HTML="$(curl -fsSL --max-time 15 https://routeriff.vercel.app/)"
          printf "%s" "$HTML" | grep -q 'RouteRiff'
          printf "%s" "$HTML" | grep -q 'routeriff.vercel.app'
      - name: Check sitemap
        shell: bash
        run: |
          XML="$(curl -fsS --max-time 15 https://routeriff.vercel.app/sitemap.xml)"
          printf "%s" "$XML" | grep -q 'https://routeriff.vercel.app/'

      - name: Check public route audit API
        shell: bash
        run: |
          BODY="$(curl -fsS --max-time 15 'https://routeriff.vercel.app/api/audit?points=35.6762%2C139.6503%2CTokyo%7C35.0116%2C135.7681%2CKyoto%7C35.2324%2C139.1070%2CHakone%7C34.6937%2C135.5023%2COsaka&days=7')"
          echo "$BODY"
          printf "%s" "$BODY" | grep -q '"ok":true'
          printf "%s" "$BODY" | grep -q '"verdict":'
          printf "%s" "$BODY" | grep -q '"backtracking_flags":'

      - name: Check Markdown negotiation
        shell: bash
        run: |
          curl -fsS -D /tmp/headers -H 'Accept: text/markdown' --max-time 15 https://routeriff.vercel.app/ -o /tmp/home.md
          echo '--- RESPONSE HEADERS ---'
          cat /tmp/headers
          echo '--- MARKDOWN HEAD ---'
          head -n 24 /tmp/home.md
          grep -qi '^content-type: text/markdown' /tmp/headers
          grep -qi '^vary:.*Accept' /tmp/headers
          grep -q '^# RouteRiff' /tmp/home.md
          grep -q 'Public route-audit API' /tmp/home.md

      - name: Check agent discovery resources
        shell: bash
        run: |
          curl -fsS --max-time 15 https://routeriff.vercel.app/openapi.json | grep -q '"/api/audit"'
          curl -fsS --max-time 15 https://routeriff.vercel.app/.well-known/agent-skills/index.json | grep -q 'routeriff-route-audit'
          curl -fsS --max-time 15 https://routeriff.vercel.app/.well-known/ai-catalog.json | grep -q 'RouteRiff Route Audit API'
          curl -fsS --max-time 15 https://routeriff.vercel.app/ai/index.ilang | grep -q '::ILANG::COMPLETE::'
